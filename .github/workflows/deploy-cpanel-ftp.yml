name: Deploy to Hostico (cPanel FTPS)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build Static Site & Deploy via FTPS

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            immersive-web/package-lock.json

      - name: Install Dependencies
        run: |
          if [ -f "immersive-web/package.json" ]; then
            cd immersive-web && npm ci
          else
            npm ci
          fi

      - name: Build Static Export
        run: |
          if [ -f "immersive-web/package.json" ]; then
            cd immersive-web && npm run build
          else
            npm run build
          fi

      - name: Sync Static Files to Hostico via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ${{ hashFiles('immersive-web/out/index.html') != '' && './immersive-web/out/' || './out/' }}
          server-dir: ${{ secrets.CPANEL_FTP_REMOTE_DIR || 'public_html/' }}
          dangerous-clean-slate: false
